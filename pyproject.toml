[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wqu"
version = "0.1.0"
description = "Upload .xlsx quizzes produced by the Quiz Toolkit to Wayground (formerly Quizizz): publish, optionally assign, and return join links."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kath Puno" }]
keywords = ["quizizz", "wayground", "playwright", "automation", "edtech", "python-cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
wqu = "wqu.cli:main"

[tool.setuptools.packages.find]
include = ["wqu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Wayground session + network (opt-in via WQU_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
